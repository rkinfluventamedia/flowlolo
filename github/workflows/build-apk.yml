name: Build FlowLoLo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (repo files uthao)
        uses: actions/checkout@v4

      - name: Unzip source (zip kahin bhi ho, dhundh lega)
        run: |
          ZIP=$(find . -name "FlowLoLo-app-source.zip" | head -n 1)
          echo "Zip mila: $ZIP"
          unzip -q "$ZIP"
          ls flowlolo-app | head -n 5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          cd flowlolo-app
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowLoLo-debug-APK
          path: flowlolo-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
